name: Bug
description: Algo não funciona como deveria
labels: ['bug']
body:
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu?
      description: O que você fez, o que esperava e o que aconteceu de fato.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abra a conversa com...
        2. Toque em...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão do app
      description: Configurações → Sobre. Se for do código, informe o commit.
  - type: dropdown
    id: platform
    attributes:
      label: Plataforma
      options: [iOS, Android, Simulador iOS, Emulador Android]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Prints ou logs
      description: Não inclua números de telefone nem dados de outras pessoas.
